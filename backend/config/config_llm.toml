[llm]

probe_prompt = "Reply with exactly one word: OK"

remote_providers =[
    "gemini",
    "gemini-flash",
    "gemini-2.5-pro",
    "gemini-2-flash",
    "gemini-3-flash",
    "gemini-3.1-pro",
    "openai-gpt-5.1",
    "openrouter",
]

[llm.providers."gemini"]
model = "gemini-2.5-flash-lite"
type = "gemini"

[llm.providers."gemini-flash"]
model = "gemini-2.5-flash"
type = "gemini"

[llm.providers."gemini-2.5-pro"]
model = "gemini-2.5-pro"
type = "gemini"

[llm.providers."gemini-2-flash"]
model = "gemini-2.0-flash"
type = "gemini"

[llm.providers."gemini-3-flash"]
model = "gemini-3-flash-preview"
type = "gemini"

[llm.providers."gemini-3.1-pro"]
model = "gemini-3.1-pro-preview"
type = "gemini"

[llm.providers."openai-gpt-5.1"]
model = "gpt-5.1"
type = "openai"

[llm.providers."openrouter"]
model = "deepseek/deepseek-v4-pro"
type = "openrouter"

